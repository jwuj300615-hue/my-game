      modal=null;closeModalDom();log("必須返回龍脊鎮才能使用倉庫。","bad");render();return;
    }
    box.innerHTML=`
      <div class="split"><h2 style="margin:0">城鎮倉庫</h2><button id="closeModal">關閉</button></div>
      <div class="grid2" style="margin-top:12px">
        <div class="panel" style="margin:0"><h3>背包 ${state.inventory.length}/${inventoryCap()}</h3>
          ${state.inventory.length?state.inventory.map(it=>`<div class="item"><div><div class="item-title">${escapeHtml(it.name)}${it.qty?` ×${it.qty}`:""}</div><div class="item-meta">${itemDescription(it)}</div></div><button data-deposit="${it.id}">存入</button></div>`).join(""):`<div class="empty">背包是空的。</div>`}
        </div>
        <div class="panel" style="margin:0"><h3>倉庫 ${state.warehouse.length}/${WAREHOUSE_CAP}</h3>
          ${state.warehouse.length?state.warehouse.map(it=>`<div class="item"><div><div class="item-title">${escapeHtml(it.name)}${it.qty?` ×${it.qty}`:""}</div><div class="item-meta">${itemDescription(it)}</div></div><button data-withdraw="${it.id}" class="primary">取出</button></div>`).join(""):`<div class="empty">倉庫是空的。</div>`}
        </div>
      </div>`;
    document.getElementById("closeModal").onclick=()=>{modal=null;closeModalDom()};
    document.querySelectorAll("[data-deposit]").forEach(b=>b.onclick=()=>depositToWarehouse(b.dataset.deposit));
    document.querySelectorAll("[data-withdraw]").forEach(b=>b.onclick=()=>withdrawFromWarehouse(b.dataset.withdraw));
  }
  function depositToWarehouse(id){
    const idx=state.inventory.findIndex(i=>i.id===id);if(idx<0)return;
    const it=state.inventory[idx];
    const copy=deepCopy(it);
    if(!addWarehouse(copy)){renderWarehouseModal(document.getElementById("modalContent"));return;}
    state.inventory.splice(idx,1);
    log(`你將${it.name}${it.qty?` ×${it.qty}`:""}存入倉庫。`);
    autoSave();renderWarehouseModal(document.getElementById("modalContent"));
  }
  function withdrawFromWarehouse(id){
    const idx=state.warehouse.findIndex(i=>i.id===id);if(idx<0)return;
    const it=state.warehouse[idx];
    const copy=deepCopy(it);
    if(!addInventory(copy)){renderWarehouseModal(document.getElementById("modalContent"));return;}
    state.warehouse.splice(idx,1);
    log(`你從倉庫取出${it.name}${it.qty?` ×${it.qty}`:""}。`);
    autoSave();renderWarehouseModal(document.getElementById("modalContent"));
  }

  function renderForgeModal(box){
    if(state.location!=="town"){
      modal=null;closeModalDom();log("必須返回龍脊鎮才能使用鍛造工坊。","bad");render();return;
    }
    const items=refinableItems();
    box.innerHTML=`
      <div class="split"><h2 style="margin:0">鍛造工坊</h2><button id="closeModal">關閉</button></div>
      <div class="notice" style="margin-top:12px">最高可精煉至 +10。失敗只會消耗金幣與精煉石，不會降級、損壞或消失。</div>
      <p>持有精煉石：<strong>${itemCountByKey("refineStone")}</strong>　金幣：<strong>${state.player.gold}</strong></p>
      <div>${items.length?items.map(it=>{
        const rule=refineRule(it);
        const capped=(it.refine||0)>=10;
        return `<div class="item">
          <div><div class="item-title">${escapeHtml(it.name)}</div><div class="item-meta">${itemDescription(it)}<br>${capped?"已達最高精煉":"下次：+"+rule.next+"｜精煉石 "+rule.stones+"｜"+rule.gold+"金幣｜難度："+rule.label}</div></div>
          <div class="item-buttons"><button data-refine="${it.id}" class="spirit" ${capped?"disabled":""}>精煉</button></div>
        </div>`;
      }).join(""):`<div class="empty">目前沒有可精煉的裝備。</div>`}</div>
    `;
    document.getElementById("closeModal").onclick=()=>{modal=null;closeModalDom()};
    document.querySelectorAll("[data-refine]").forEach(b=>b.onclick=()=>refineItem(b.dataset.refine));
  }
  function findOwnedItem(id){
    return state.inventory.find(i=>i.id===id)||getAllEquipped().find(i=>i.id===id)||null;
  }
  function refineItem(id){
    const it=findOwnedItem(id);if(!it)return;
    const rule=refineRule(it);
    if((it.refine||0)>=10)return;
    if(itemCountByKey("refineStone")<rule.stones){log("精煉石不足。","bad");renderForgeModal(document.getElementById("modalContent"));return;}
    if(state.player.gold<rule.gold){log("金幣不足。","bad");renderForgeModal(document.getElementById("modalContent"));return;}
    consumeByKey("refineStone",rule.stones);state.player.gold-=rule.gold;
    if(Math.random()<rule.chance){
      it.refine=rule.next;
      if(!it.baseDisplayName) it.baseDisplayName=String(it.name).replace(/\s\+\d+$/," ").trim();
      it.name=`${it.baseDisplayName} +${it.refine}`;
      if(it.kind==="weapon"){it.min+=1;it.max+=1;}
      else if((it.def||0)>0){it.def+=1;}
      else{it.hp=(it.hp||0)+1;}
      log(`${it.baseDisplayName}精煉成功，提升至 +${it.refine}。`,"good");
    }else{
      log(`${it.name}精煉失敗，但裝備沒有損壞。`,"bad");
    }
    recalcHpAfterEquip();autoSave();renderForgeModal(document.getElementById("modalContent"));
    const goldChip=document.querySelector(".chip.gold");if(goldChip)goldChip.textContent=`金幣 ${state.player.gold}`;
  }

  function renderCombatItemsModal(box){
    const items=state.inventory.filter(i=>i.kind==="consumable");
    box.innerHTML=`
      <div class="split"><h2 style="margin:0">使用物品</h2><button id="closeModal">關閉</button></div>
      <div style="margin-top:12px">${items.length?items.map(i=>`<div class="item">
        <div><div class="item-title">${i.name} ×${i.qty}</div><div class="item-meta">${i.desc}</div></div>
        <button data-cuse="${i.id}">使用</button>
      </div>`).join(""):`<div class="empty">沒有可使用的補給品。</div>`}</div>
    `;
    document.getElementById("closeModal").onclick=()=>{modal=null;closeModalDom()};
    document.querySelectorAll("[data-cuse]").forEach(b=>b.onclick=()=>useItem(b.dataset.cuse,true));
  }

  function renderSpiritsModal(box){
    const inCombat=hasCombat();
    const all=equippedSpirits();
    const items=inCombat?all:all.filter(i=>spiritCanUseOutOfCombat(i.spirit));
    const cost=spiritCost();
    box.innerHTML=`
      <div class="split"><h2 style="margin:0">與精靈溝通</h2><button id="closeModal">關閉</button></div>
      <p class="small">每次主動呼喚消耗${cost}點氣力。${inCombat?"施放後敵方會進入回合。":"非戰鬥狀態只顯示治療、淨化與防護型精靈。"}</p>
      <div>${items.length?items.map(i=>`<div class="item">
        <div><div class="item-title">${i.name}</div><div class="item-meta">精靈附加：${i.spirit}<br>${spiritEffectText(i.spirit)}</div></div>
        <button data-spirit="${i.id}" class="spirit">呼喚</button>
      </div>`).join(""):`<div class="empty">目前沒有可在此狀態使用的精靈。</div>`}</div>
    `;
    document.getElementById("closeModal").onclick=()=>{modal=null;closeModalDom()};
    document.querySelectorAll("[data-spirit]").forEach(b=>b.onclick=()=>callSpirit(b.dataset.spirit));
  }

  function renderLog(){
    const rows=state.log.slice(-30).reverse();
    return `<div class="log" id="gameLog">${rows.map(x=>`<p class="${x.cls||""}">${escapeHtml(x.msg)}</p>`).join("")}</div>`;
  }

  function escapeHtml(s){
    return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
  }

  loadSave();
  render();
})();
</script>
</body>
</html>
