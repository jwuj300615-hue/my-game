<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#17130f" />
  <title>龍脊深境</title>
  <style>
    :root{
      --bg:#0f0d0b;
      --panel:#1b1712;
      --panel2:#241e17;
      --line:#4a3b2b;
      --gold:#d1a85b;
      --gold2:#f0d28e;
      --text:#e8dfce;
      --muted:#a99d89;
      --danger:#c7675b;
      --good:#78b982;
      --spirit:#8f87d8;
      --blue:#6fa1bd;
      --shadow:0 12px 35px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:
      radial-gradient(circle at top,#2b2117 0,#15110d 38%,#0b0908 100%);
      color:var(--text);font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif}
    body{padding:16px}
    button,input,select{font:inherit}
    button{
      border:1px solid #66513a;background:linear-gradient(#3a2e22,#281f18);
      color:var(--text);padding:10px 14px;border-radius:8px;cursor:pointer;
      transition:.15s;box-shadow:0 2px 0 rgba(0,0,0,.35)
    }
    button:hover:not(:disabled){filter:brightness(1.15);transform:translateY(-1px)}
    button:disabled{opacity:.45;cursor:not-allowed}
    button.primary{border-color:#9a7845;background:linear-gradient(#6b4f2b,#46331f);color:#fff3cf}
    button.danger{border-color:#8b463e;background:linear-gradient(#65332f,#41211f)}
    button.good{border-color:#477952;background:linear-gradient(#355d3d,#243f2a)}
    button.spirit{border-color:#6259a6;background:linear-gradient(#473f79,#302b55)}
    button.ghost{background:transparent}
    .app{max-width:1180px;margin:0 auto}
    .header{
      display:flex;align-items:center;justify-content:space-between;gap:16px;
      border:1px solid var(--line);background:rgba(27,23,18,.92);
      padding:14px 16px;border-radius:12px;box-shadow:var(--shadow);margin-bottom:12px
    }
    .brand h1{margin:0;font-size:clamp(22px,4vw,34px);letter-spacing:2px;color:var(--gold2)}
    .brand small{color:var(--muted)}
    .status-strip{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .chip{border:1px solid var(--line);background:#15110e;padding:7px 10px;border-radius:999px;font-size:14px}
    .chip.hp{color:#e99388}.chip.sp{color:#b8b1ff}.chip.gold{color:#f3cd74}
    .layout{display:grid;grid-template-columns:250px 1fr;gap:12px}
    .sidebar,.main{
      border:1px solid var(--line);background:rgba(27,23,18,.94);
      border-radius:12px;box-shadow:var(--shadow)
    }
    .sidebar{padding:12px;height:max-content;position:sticky;top:12px}
    .sidebar button{width:100%;margin-bottom:8px;text-align:left}
    .sidebar button.active{border-color:var(--gold);color:var(--gold2)}
    .main{padding:16px;min-height:650px}
    .panel{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:14px;margin-bottom:12px}
    .panel h2,.panel h3{margin-top:0;color:var(--gold2)}
    .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .stat-card{border:1px solid #4d4031;background:#17130f;border-radius:10px;padding:12px}
    .stat-card strong{font-size:24px;color:var(--gold2)}
    .bar{height:12px;border-radius:999px;background:#0c0a08;border:1px solid #3a2f24;overflow:hidden}
    .bar>span{display:block;height:100%;background:linear-gradient(90deg,#8c332f,#d66d5f)}
    .bar.sp>span{background:linear-gradient(90deg,#4f478c,#9186df)}
    .bar.xp>span{background:linear-gradient(90deg,#3f6a7d,#73b3cf)}
    .log{
      height:280px;overflow:auto;background:#0d0b09;border:1px solid #3b3025;
      border-radius:8px;padding:12px;line-height:1.75
    }
    .log p{margin:.2em 0}.log .good{color:#8ed297}.log .bad{color:#df8175}.log .spirit{color:#b9b2ff}.log .gold{color:#efc866}
    .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .item{
      border:1px solid #4b3e30;background:#17130f;border-radius:10px;padding:12px;
      display:flex;justify-content:space-between;gap:12px;align-items:flex-start
    }
    .item+.item{margin-top:8px}
    .item-title{font-weight:700;color:#f0e6d3}
    .item-meta{color:var(--muted);font-size:14px;line-height:1.55;margin-top:4px}
    .item-buttons{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
    .rarity-common{color:#ddd}.rarity-fine{color:#75c18a}.rarity-rare{color:#6fa7e8}.rarity-epic{color:#b680e8}.rarity-legendary{color:#efbd62}.rarity-ancient{color:#ef665f;text-shadow:0 0 8px rgba(239,102,95,.25)}
    .spirit-tag{color:#b9b2ff}
    .equipment-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .slot{border:1px dashed #5b4a37;background:#15110e;border-radius:10px;padding:12px;min-height:92px}
    .slot strong{display:block;color:var(--gold2);margin-bottom:6px}
    .shop-tabs,.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
    .shop-tabs button.active,.subtabs button.active{border-color:var(--gold);color:var(--gold2)}
    input[type="text"],input[type="number"],select{
      width:100%;padding:11px;border-radius:8px;border:1px solid #5b4936;background:#100d0a;color:var(--text)
    }
    .create-wrap{max-width:760px;margin:20px auto}
    .create-title{text-align:center;margin-bottom:16px}
    .dice{font-size:34px;text-align:center;margin:12px 0;color:var(--gold2)}
    .sex-picks{display:flex;gap:10px}.sex-picks button{flex:1}
    .sex-picks button.selected{border-color:var(--gold);background:linear-gradient(#6b4f2b,#46331f)}
    .notice{border-left:4px solid var(--gold);padding:10px 12px;background:#19140f;color:#cdbfa9;border-radius:6px}
    .enemy-card{border:1px solid #69403b;background:#211512;border-radius:10px;padding:14px}
    .enemy-card h2{color:#e5968d}
    .enemy-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:12px}
    .enemy-card{cursor:pointer;transition:.15s}
    .enemy-card.selected{outline:2px solid var(--gold);box-shadow:0 0 0 3px rgba(209,168,91,.12)}
    .enemy-card.defeated{opacity:.42;filter:grayscale(.8);cursor:default}
    .burst-badge{display:inline-block;margin-left:8px;padding:3px 8px;border:1px solid #b58a43;border-radius:999px;color:#ffe2a3;background:#49351d;font-size:13px}
    .boss-shell{
      border:1px solid #68402f;background:linear-gradient(180deg,#17100d,#0c0908);
      border-radius:14px;overflow:hidden;box-shadow:0 18px 42px rgba(0,0,0,.48),inset 0 0 55px rgba(120,45,25,.12)
    }
    .boss-header{padding:16px 18px 12px;background:linear-gradient(180deg,rgba(64,29,20,.92),rgba(20,13,10,.96));border-bottom:1px solid #6c422f}
    .boss-kicker{text-align:center;color:#c68b66;font-size:13px;letter-spacing:3px}
    .boss-name{text-align:center;margin:3px 0 8px;color:#ffd3a0;font-size:clamp(22px,4vw,34px);text-shadow:0 0 16px rgba(225,92,45,.3)}
    .boss-subtitle{text-align:center;color:#b99b84;font-size:13px;margin-bottom:10px}
    .boss-hpbar{height:20px;border-radius:4px;background:#100907;border:1px solid #7b3b2d;overflow:hidden;box-shadow:inset 0 0 8px #000}
    .boss-hpbar>span{display:block;height:100%;background:linear-gradient(90deg,#6f1514,#c63324,#e25735);box-shadow:0 0 15px rgba(226,87,53,.42)}
    .boss-hptext{text-align:center;color:#e7c8ac;font-size:13px;margin-top:6px}
    .boss-stage-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
    .boss-stage{border:1px solid #6e4c36;background:#17100c;border-radius:999px;padding:5px 10px;font-size:12px;color:#d9b998}
    .boss-stage.danger{border-color:#9d4334;color:#ff8a72;background:#2a100d;animation:bossPulse 1.1s infinite alternate}
    @keyframes bossPulse{from{box-shadow:0 0 0 rgba(211,61,42,0)}to{box-shadow:0 0 15px rgba(211,61,42,.35)}}
    .boss-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,.85fr);min-height:430px}
    .boss-arena{position:relative;min-height:430px;background-size:cover;background-position:center;overflow:hidden}
    .boss-arena:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(9,5,4,.18) 55%,rgba(12,8,7,.92));pointer-events:none}
    .boss-arena:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 70px rgba(0,0,0,.68);pointer-events:none}
    .boss-warning{position:absolute;z-index:2;left:50%;bottom:24px;transform:translateX(-50%);width:min(88%,700px);text-align:center;
      padding:12px 16px;border:1px solid #9f4938;border-radius:8px;background:rgba(39,10,8,.84);color:#ff866f;font-weight:700;font-size:18px;text-shadow:0 0 10px #000}
    .boss-warning.quiet{border-color:#624630;background:rgba(20,13,10,.75);color:#d2ad88;font-weight:500;font-size:14px}
    .boss-logbox{border-left:1px solid #5c382a;background:rgba(15,10,8,.96);padding:14px}
    .boss-logbox h3{margin:0 0 10px;color:#e7c8ac}
    .boss-logbox .log{height:365px}
    .boss-player{padding:14px 16px;background:linear-gradient(180deg,#18110e,#100c0a);border-top:1px solid #5c382a}
    .boss-player-top{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center}
    .boss-player .player-meter{border:1px solid #49362c;background:#0e0a08;border-radius:9px;padding:9px}
    .boss-player .bar{height:10px;margin-top:6px}
    .boss-actions{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:12px}
    .boss-actions button{text-align:center;padding:12px 6px;min-height:48px}
    .camp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
    .camp-card{border:1px solid #4f4030;background:#16110e;border-radius:10px;padding:12px}
    .camp-card h3{margin:0 0 6px;color:#edd2a2}
    .camp-active{border-color:#8b724b;box-shadow:0 0 0 2px rgba(209,168,91,.08)}
    .camp-timer{font-size:26px;color:#f0d28e;font-weight:700;letter-spacing:1px;margin:10px 0}
    .boss-victory-title{text-align:center;color:#f4cf77;font-size:30px;letter-spacing:3px;margin:6px 0 2px}
    .boss-victory-sub{text-align:center;color:#b8a38c;margin-bottom:14px}
    .reward-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .reward-box{border:1px solid #5a4935;background:#15110e;border-radius:9px;padding:11px;color:#eadfc9}
    .hidden{display:none!important}
    .footer{color:#867b6b;font-size:12px;text-align:center;margin-top:12px}
    .modal-backdrop{
      position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;
      padding:18px;z-index:20
    }
    .modal{width:min(620px,100%);max-height:85vh;overflow:auto;background:#1c1712;border:1px solid #6a543c;
      border-radius:12px;padding:16px;box-shadow:var(--shadow)}
    .small{font-size:13px;color:var(--muted)}
    .split{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed #4c3d2e;border-radius:10px}
    @media(max-width:820px){
      body{padding:8px}.layout{grid-template-columns:1fr}.sidebar{position:static;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
      .sidebar button{margin:0;text-align:center;padding:9px 6px}.main{min-height:auto}.header{align-items:flex-start;flex-direction:column}
      .status-strip{justify-content:flex-start}.grid2,.grid3{grid-template-columns:1fr}.equipment-grid{grid-template-columns:1fr}
      .item{flex-direction:column}.item-buttons{justify-content:flex-start}.log{height:240px}
      .boss-grid{grid-template-columns:1fr}.boss-logbox{border-left:0;border-top:1px solid #5c382a}.boss-logbox .log{height:220px}
      .boss-player-top{grid-template-columns:1fr}.boss-actions{grid-template-columns:repeat(3,minmax(0,1fr))}
      .camp-grid,.reward-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
<div class="app">
  <div id="root"></div>
</div>

  function bossDisplayName(e){return String(e?.name||"深境主宰").replace(/（再臨\d+）/g,"");}
  function bossProfile(e){
    const n=String(e?.name||"");
    if(/迷霧|月蝕|祭司/.test(n))return {title:"幽霧主祭",art:BOSS_ART.priest,skill:"幽霧祭儀",phase2:"魂霧沸騰",phase3:"月蝕降臨",kind:"mist"};

    if(/巨岩魔像/.test(n))return {title:"熔核守衛",art:BOSS_ART.giant,skill:"熔核震擊",phase2:"地脈過熱",phase3:"崩岳核心",kind:"stone"};
    return {title:"龍骸霸主",art:BOSS_ART.dragon,skill:/裂骨獸/.test(n)?"崩岩碎顎":"龍骸震怒",phase2:"骨怒狂襲",phase3:"深境震怒",kind:"bone"};
  }
  function bossPhaseFromHp(e){const r=Math.max(0,Number(e?.hp||0))/Math.max(1,Number(e?.maxHp||1));return r<=.30?3:r<=.60?2:1;}
  function updateBossPhase(e){
    if(!e?.boss)return 1;
    const next=bossPhaseFromHp(e),old=Math.max(1,Number(e.phase||1));
    if(next>old){
      e.phase=next;const p=bossProfile(e);
      log(`${bossDisplayName(e)}進入第${next===2?"二":"三"}階段：${next===2?p.phase2:p.phase3}！`,"bad");
    }else if(!e.phase)e.phase=next;
    return e.phase||next;
  }

    if(!state.camp?.activity||!state.camp?.startedAt)return 0;

  function formatCampTime(ms){

  function campBonus(activity){
    let m=1;
    if(activity==="training"&&state.player?.profession==="龍脊戰衛")m*=1.25;
    if(activity==="gather"&&state.player?.profession==="荒魂獵手")m*=1.25;
    if(activity==="meditate"&&state.player?.profession==="幽契術士")m*=1.25;
    if(activity==="mining"&&state.player?.race==="矮人")m*=1.20;
    return m;
  }
  function defaultPlayerStatus(){return {poison:0,petrify:0,confusion:0,drunk:0,sleep:0,paralysis:0};}
  function normalizePlayerStatus(status){
    const out=defaultPlayerStatus();
    if(status&&typeof status==="object") for(const k of Object.keys(out)) out[k]=Number(status[k]||0);
    return out;
  }
  function playerStatusLabel(key){return ({poison:"中毒",petrify:"石化",confusion:"混亂",drunk:"酒醉",sleep:"睡眠",paralysis:"麻痺"})[key]||key;}
  function playerStatusList(){
    const st=normalizePlayerStatus(state.player?.status);
    return Object.keys(st).filter(k=>st[k]>0).map(playerStatusLabel);
  }
  function clearPlayerStatus(key){
    state.player.status=normalizePlayerStatus(state.player.status);
    if(key==="all"){
      const had=playerStatusList();
      Object.keys(state.player.status).forEach(k=>state.player.status[k]=0);
      if(had.length) log(`全部異常狀態已解除：${had.join("、")}。`,"good");
      return had.length>0;
    }
    if((state.player.status[key]||0)>0){state.player.status[key]=0;log(`你的${playerStatusLabel(key)}狀態已解除。`,"good");return true;}
    return false;
  }
  function applyPlayerStatus(key,source="敵人",duration=rand(3,5)){
    state.player.status=normalizePlayerStatus(state.player.status);
    if(key==="poison" && Math.random()<poisonResistChance()) {log("矮人的強韌體質抵抗了毒素。","good");return false;}
    const gearResist=statusResistBonus(key);
    if(gearResist>0 && Math.random()<gearResist){log(`裝備的抗性使你抵抗了${playerStatusLabel(key)}。`,"good");return false;}
    state.player.status[key]=Math.max(state.player.status[key]||0,duration);
    log(`${source}使你陷入${playerStatusLabel(key)}狀態，預計持續${duration}回合。`,"bad");
    return true;
  }
  function tickPlayerStatuses(){
    state.player.status=normalizePlayerStatus(state.player.status);
    for(const key of Object.keys(state.player.status)){
      if(state.player.status[key]>0){
        state.player.status[key]--;
        if(state.player.status[key]===0) log(`你的${playerStatusLabel(key)}狀態隨著回合結束而解除。`,"good");
      }
    }
  }

  function rollStats(){

      weapons:[
        ...WEAPON_TEMPLATES.map(t=>createItemFromWeapon(t,shopRarity())),
        ...HAND_GEAR.map(t=>createHandGear(t,shopRarity()))
      ],

    state.clown={active:!!eligible&&Math.random()<.30,bought:0};
    if(state.clown.active) log("一名打扮誇張的小丑出現在城鎮廣場，推著裝滿驚喜箱的小車。","spirit");
  }
  function rarityIndex(id){return RARITIES.findIndex(r=>r.id===id);}
  function nextRarityId(id,allowAncient=false){
    const i=rarityIndex(id);
    if(i<0)return "fine";
    if(id==="legendary") return allowAncient?"ancient":null;
    if(id==="ancient") return null;
    return RARITIES[i+1]?.id||null;
  }
  function gearRootName(it){
    let n=String(it.baseName||it.baseDisplayName||it.name||"裝備").replace(/\s\+\d+$/," ").trim();
    for(const r of RARITIES){if(n.startsWith(r.name+" ")){n=n.slice(r.name.length+1);break;}}
    return n;
  }
  function upgradeGearRarity(it,toId){
    const from=RARITIES.find(r=>r.id===(it.rarity||"common"))||RARITIES[0];
    const to=RARITIES.find(r=>r.id===toId);if(!to)return false;
    const ratio=to.mult/from.mult;
    for(const key of ["min","max","atk","def","hp","str","con","dex","charm","spiritBonus"]){
      if(typeof it[key]==="number"&&it[key]!==0) it[key]=Math.max(it[key]>0?1:it[key],Math.round(it[key]*ratio));
    }
    it.price=Math.max(1,Math.round((it.price||10)*ratio));
    it.rarity=to.id;
    const root=gearRootName(it);it.baseName=root;
    it.baseDisplayName=(to.id==="common"?"":to.name+" ")+root;
    it.name=it.baseDisplayName+((it.refine||0)>0?` +${it.refine}`:"");
    return true;
  }

  function rarityForFloor(floor,boss=false){
    const roll=Math.random();
    if(boss){
      if(roll<.03) return "legendary";
      if(roll<.20) return "epic";
      if(roll<.60) return "rare";
      return "fine";
    }
    const bonus=Math.min(.12,floor*.006);
    if(roll<.002+bonus*.08) return "legendary";
    if(roll<.02+bonus*.25) return "epic";
    if(roll<.10+bonus) return "rare";
    if(roll<.35+bonus) return "fine";
    return "common";
  }

  function addToContainer(container,item,cap,label){
    if(item.qty){
      const same=container.find(x=>x.key===item.key && x.kind===item.kind);
      if(same){same.qty+=item.qty;return true;}
    }
    if(container.length>=cap){
      if(state.player) log(`${label}已滿（${cap}格），無法放入${item.name}。`,"bad");
      return false;
    }
    container.push(item);return true;
  }
  function addInventory(item){return addToContainer(state.inventory,item,inventoryCap(),"背包");}
  function addWarehouse(item){return addToContainer(state.warehouse,item,WAREHOUSE_CAP,"倉庫");}
  function removeInventoryItem(id,qty=1){
    const idx=state.inventory.findIndex(x=>x.id===id);
    if(idx<0) return null;
    const it=state.inventory[idx];
    if(it.qty && it.qty>qty){ it.qty-=qty; return deepCopy({...it,qty}); }
    return state.inventory.splice(idx,1)[0];
  }

  function loadSave(){

      if(!parsed.player) return false;
      state=parsed;
      migrateState();

      currentView=hasCombat() ? "combat" : (state.location==="dungeon" ? "dungeon" : "town");

      <div class="item-meta">${meta}</div></div>
      <div class="item-buttons">${buttons.join("")}</div>
    </div>`;
  }

  function itemDescription(it){

    if(it.atk) parts.push(`攻擊${it.atk>0?"＋":""}${it.atk}`);
    if(it.def) parts.push(`防禦${it.def>0?"＋":""}${it.def}`);
    if(it.hp) parts.push(`生命${it.hp>0?"＋":""}${it.hp}`);
    if(it.str) parts.push(`力量${it.str>0?"＋":""}${it.str}`);
    if(it.con) parts.push(`體質${it.con>0?"＋":""}${it.con}`);
    if(it.dex) parts.push(`敏捷${it.dex>0?"＋":""}${it.dex}`);
    if(it.charm) parts.push(`魅力${it.charm>0?"＋":""}${it.charm}`);
    if(it.crit) parts.push(`會心率＋${Math.round(it.crit*100)}%`);
    if(it.dodge) parts.push(`迴避率＋${Math.round(it.dodge*100)}%`);
    if(it.block) parts.push(`格擋率＋${Math.round(it.block*100)}%`);
    if(it.carry) parts.push(`背包上限＋${it.carry}格`);
    if(it.initiative) parts.push(`先制補正＋${Math.round(it.initiative*100)}%`);
    if(it.hpRegen) parts.push(`每回合恢復生命 ${it.hpRegen}`);
    if(it.spiritRegen) parts.push(`每回合恢復氣力 ${it.spiritRegen}`);
    if(it.spiritCostReduce) parts.push(`呼喚精靈氣力消耗－${it.spiritCostReduce}`);
    if(it.confusionResist) parts.push(`混亂抗性＋${Math.round(it.confusionResist*100)}%`);
    if(it.paralysisResist) parts.push(`麻痺抗性＋${Math.round(it.paralysisResist*100)}%`);
    if(it.sleepResist) parts.push(`睡眠抗性＋${Math.round(it.sleepResist*100)}%`);
    if(it.fleeBonus) parts.push(`逃跑成功率＋${Math.round(it.fleeBonus*100)}%`);
    if(it.reviveOnce) parts.push(`每場戰鬥氣絕時可自動復活1次`);
    if(it.sockets) parts.push(`寶石孔：${it.sockets}（寶石系統尚未開放）`);
    if(it.spirit) parts.push(`<span class="spirit-tag">精靈附加：${it.spirit}</span><br><span class="small">${spiritEffectText(it.spirit)}</span>`);
    if(it.storedSpirit) parts.push(`<span class="spirit-tag">封存精靈：${it.storedSpirit}</span><br><span class="small">${spiritEffectText(it.storedSpirit)}</span>`);
    if(it.desc) parts.push(it.desc);
    return parts.join("<br>");
  }

  function renderSlot(key,label){
    const it=state.equipment[key];
    if(!it) return `<div class="slot"><strong>${label}</strong><span class="small">未裝備</span></div>`;
    if(it.linkedTo) return `<div class="slot"><strong>${label}</strong><span class="small">雙手武器占用</span></div>`;
    return `<div class="slot">
      <strong>${label}</strong>
      <div class="${(RARITIES.find(r=>r.id===it.rarity)||{}).className||""}">${escapeHtml(it.name)}</div>
      <div class="small">${itemDescription(it)}</div>
      <button data-unequip="${key}" style="margin-top:8px">卸下</button>
    </div>`;
  }

  function uniqueHandGear(items){
    const map=new Map();
    items.filter(Boolean).forEach(it=>{if(it.linkedTo)return;map.set(it.id,it)});
    return [...map.values()];
  }
  function handGearToClearForEquip(it,hand){
    if(!hand)hand="right";
    const other=hand==="left"?"right":"left";
    const target=state.equipment[hand];
    const otherItem=state.equipment[other];
    const out=[];
    const addActual=(x,slot)=>{
      if(!x)return;
      if(x.linkedTo){
        const linked=state.equipment[slot==="left"?"right":"left"];
        if(linked&&!linked.linkedTo)out.push(linked);
      }else out.push(x);
    };
    const dragon=state.player.race==="半龍人";
    if(it.hands===2&&!dragon){addActual(target,hand);addActual(otherItem,other);}
    else if(it.hands===2&&dragon){addActual(target,hand);if(otherItem?.kind==="weapon")addActual(otherItem,other);}
    else{addActual(target,hand);if(it.kind==="weapon"&&otherItem?.hands===2)addActual(otherItem,other);}
    return uniqueHandGear(out);
  }
  function equipItem(id,hand){
    const idx=state.inventory.findIndex(x=>x.id===id);if(idx<0)return;
    const it=state.inventory[idx];
    if(it.kind==="armor"||it.kind==="accessory"){
      const old=state.equipment[it.slot];
      const needed=old?1:0;
      const projectedCap=INVENTORY_CAP+Math.max(0,equipBonus("carry")-(old?.carry||0)+(it.carry||0));
      if(state.inventory.length>projectedCap){log(`更換後背包上限會降為${projectedCap}格，請先清出空間。`,"bad");render();return;}
      if(state.inventory.length-1+needed>Math.max(inventoryCap(),projectedCap)){log(`背包已滿，請先空出空間。`,"bad");render();return;}
      state.inventory.splice(idx,1);
      if(old)addInventory(old);
      state.equipment[it.slot]=it;
    }else{
      if(!hand)hand="right";
      const clears=handGearToClearForEquip(it,hand);
      if(state.inventory.length-1+clears.length>inventoryCap()){
        log(`更換此裝備需要額外${Math.max(1,clears.length-1)}格背包空間，請先整理背包。`,"bad");render();return;
      }
      state.inventory.splice(idx,1);
      const other=hand==="left"?"right":"left";
      const dragon=state.player.race==="半龍人";
      if(it.hands===2&&!dragon){clearHand("left",true);clearHand("right",true);state.equipment.right=it;state.equipment.left={linkedTo:it.id};}
      else if(it.hands===2&&dragon){
        clearHand(hand,true);
        const otherItem=state.equipment[other];
        if(otherItem?.linkedTo)clearHand(other,true);else if(otherItem?.kind==="weapon")clearHand(other,true);
        state.equipment[hand]=it;
      }else{
        const targetItem=state.equipment[hand];
        if(targetItem?.linkedTo)clearHand(other,true);else clearHand(hand,true);
        const remainingOther=state.equipment[other];
        if(it.kind==="weapon"&&remainingOther?.hands===2)clearHand(other,true);
        state.equipment[hand]=it;
      }
    }
    recalcHpAfterEquip();log(`你裝備了${it.name}。`);autoSave();render();
  }
  function swapIntoSlot(slot,it){
    const old=state.equipment[slot];
    if(old&&!addInventory(old))return false;
    state.equipment[slot]=it;return true;
  }
  function clearHand(hand,force=false){
    const it=state.equipment[hand];if(!it)return true;
    if(it.linkedTo){state.equipment[hand]=null;return true;}
    if(!force&&!addInventory(it))return false;
    if(force)addInventory(it);
    if(it.hands===2){
      const other=hand==="left"?"right":"left";
      if(state.equipment[other]&&state.equipment[other].linkedTo===it.id)state.equipment[other]=null;
    }
    state.equipment[hand]=null;return true;
  }
  function unequipSlot(slot){
    const it=state.equipment[slot];if(!it||it.linkedTo)return;
    const projectedCap=INVENTORY_CAP+Math.max(0,equipBonus("carry")-(it.carry||0));
    if(state.inventory.length+1>projectedCap){log(`卸下${it.name}後背包上限只剩${projectedCap}格，請先清出空間。`,"bad");render();return;}
    if(state.inventory.length>=inventoryCap()){log(`背包已滿（${inventoryCap()}格），無法卸下裝備。`,"bad");render();return;}
    if(slot==="left"||slot==="right"){if(!clearHand(slot))return;}
    else{if(!addInventory(it))return;state.equipment[slot]=null;}
    recalcHpAfterEquip();autoSave();render();
  }
  function recalcHpAfterEquip(){
    state.player.hp2=Math.min(state.player.hp2,maxHp2());
  }

  function exploreDungeon(){
    const d=state.dungeon;
    if(d.progress>=FLOOR_STEPS) return;
    if(d.progress===FLOOR_STEPS-1 && d.floor%5===0){
      startCombat([makeBoss(d.floor)],true);
      return;
    }
    if(Math.random()<.02){
      d.progress++;
      d.goldStatueActive=true;
      log("你在幽暗岔路發現一座點石成金雕像。石像要求投入1000金幣，換取一次裝備品質升階。","gold");
      modal={type:"goldStatue"};autoSave();render();return;
    }
    const fieldMod=Number(state.player.professionRuntime?.fieldEncounterMod||0);
    if(state.player.professionRuntime)state.player.professionRuntime.fieldEncounterMod=0;
    const roll=Math.random();
    const encounterThreshold=clamp(.55+fieldMod,.25,.80);
    if(roll<encounterThreshold){
      startCombat(makeEncounter(d.floor),true);
    }else if(roll<encounterThreshold+.15){
      findChest();
      d.progress++;
    }else if(roll<encounterThreshold+.25){
      spiritEvent();
      d.progress++;
    }else if(roll<Math.min(.95,encounterThreshold+.33)){
      if(trapEvent()) d.progress++;
    }else{
      log("你只找到一間安靜的空室。短暫休息後，你繼續前進。");
      if(Math.random()<.5){
        state.player.spirit=clamp(state.player.spirit+3,0,100);
        log("沉靜的環境讓你的氣力稍微恢復。","spirit");
      }
      d.progress++;
    }
    autoSave();render();
  }

  function makeEnemy(floor){
    const unlocked=Math.min(ENEMIES.length,2+Math.floor((floor-1)/2));
    const base=deepCopy(pick(ENEMIES.slice(0,unlocked)));
    const scale=1+(floor-1)*.08;
    base.combatId=uid();
    base.maxHp=Math.round(base.hp*scale);base.hp=base.maxHp;
    base.atk=Math.max(1,Math.round(base.atk*scale));
    base.def=Math.round(base.def+(floor-1)*.16);
    base.dex=Math.round(base.dex+(floor-1)*.12);
    base.exp=Math.round(base.exp*scale);
    base.gold=[Math.round(base.gold[0]*scale),Math.round(base.gold[1]*scale)];
    base.status={confusion:0,sleep:0,paralysis:0,poison:0,petrify:0,drunk:0};
    base.buffs={atk:0,def:0,atkTurns:0,defTurns:0};
    base.boss=false;
    return base;
  }
  function makeEncounter(floor){
    const r=Math.random();
    let count;
    if(floor<=1) count=r<.78?1:2;
    else if(floor<=4) count=r<.55?1:(r<.90?2:3);
    else count=r<.40?1:(r<.80?2:3);
    const enemies=Array.from({length:count},()=>makeEnemy(floor));
    if(count>1){
      const groupScale=count===2?.86:.74;
      enemies.forEach(e=>{
        e.maxHp=Math.max(5,Math.round(e.maxHp*(count===2?.90:.82)));e.hp=e.maxHp;
        e.atk=Math.max(1,Math.round(e.atk*groupScale));
        e.exp=Math.max(1,Math.round(e.exp*.82));
        e.gold=[Math.max(1,Math.round(e.gold[0]*.75)),Math.max(1,Math.round(e.gold[1]*.82))];
      });
    }
    return enemies;
  }
  function makeBoss(floor){
    const e=makeEnemy(floor);
    const defeated=Number(state.dungeon.bossDefeats?.[floor]||0);
    const power=1+defeated*.30;
    e.name="樓層主・"+pick(["裂骨獸","沉眠巨蜥","迷霧祭司"])+(defeated>0?`（再臨${defeated}）`:"");
    e.maxHp=Math.round(e.maxHp*1.55*power);e.hp=e.maxHp;
    e.atk=Math.max(1,Math.round(e.atk*1.12*power));
    e.def+=1+Math.floor(defeated*.6);
    e.dex+=Math.floor(defeated*.3);
    e.exp=Math.round(e.exp*2.5*(1+defeated*.15));
    e.gold=[Math.round(e.gold[0]*2*(1+defeated*.12)),Math.round(e.gold[1]*3*(1+defeated*.12))];
    e.boss=true;e.bossFloor=floor;e.bossDefeatLevel=defeated;e.phase=1;e.telegraph=null;
    return e;
  }

  function makeInstanceBoss(){
    const level=Math.max(1,Number(state.player.level)||1);
    const name=pick(["遠古暴龍王","深淵守護獸","月蝕祭司","巨岩魔像"]);
    const maxHp=48+level*14;
    return {
      combatId:uid(),name:`副本王・${name}（Lv.${level}）`,
      hp:maxHp,maxHp,
      atk:5+Math.floor(level*1.25),
      def:1+Math.floor(level/3),
      dex:3+Math.floor(level/4),
      exp:35+level*14,
      gold:[20+level*5,35+level*8],
      status:{confusion:0,sleep:0,paralysis:0,poison:0,petrify:0,drunk:0},
      buffs:{atk:0,def:0,atkTurns:0,defTurns:0},
      boss:true,instanceBoss:true,matchedLevel:level,phase:1,telegraph:null
    };
  }

  function startBossInstance(){
    if(state.location!=="town") return;
    if(!hasItemKey("bossSummonStone")){
      log("你沒有BOSS召喚石，無法開啟副本。","bad");render();return;

    consumeByKey("bossSummonStone",1);
    state.location="bossInstance";
    log("BOSS召喚石碎裂，封印中的強大氣息回應了你的召喚。","spirit");

  }

  function startCombat(enemyOrEnemies,pending){
    const enemies=Array.isArray(enemyOrEnemies)?enemyOrEnemies:[enemyOrEnemies];

    state.dungeon.targetIndex=0;

    currentView="combat";
    autoSave();render();
  }

            <button id="callSpirit" class="spirit" ${equippedSpirits().length===0?"disabled":""}>呼喚精靈</button>
            <button id="professionCombat" class="spirit" ${state.player.profession&&professionCombatSkills().length?"":"disabled"}>職業技能</button>
            <button id="flee" ${boss.instanceBoss?"disabled":""}>${boss.instanceBoss?"無法撤退":"繞過樓層主"}</button>
          </div>
        </div>
      </div>`;
    document.getElementById("attack").onclick=()=>playerTurn("attack");
    document.getElementById("defend").onclick=()=>playerTurn("defend");
    document.getElementById("combatItem").onclick=()=>{modal={type:"combatItems"};renderModal()};
    document.getElementById("callSpirit").onclick=()=>{modal={type:"spirits"};renderModal()};
    document.getElementById("professionCombat").onclick=()=>{if(state.player.profession&&professionCombatSkills().length){modal={type:"professionSkills"};renderModal();}};
    document.getElementById("flee").onclick=tryFlee;
  }

  function renderCombat(main){
    const enemies=combatEnemies();
    if(!hasCombat()){
      if(state.location==="bossInstance"){state.location="town";currentView="town";}
      else currentView="dungeon";
      render();return;
    }
    const p=state.player;
    ensureTarget();
    const bossEnemy=enemies.find(e=>e.boss&&e.hp>0);
    if(bossEnemy){renderBossCombat(main,bossEnemy);return;}
    main.innerHTML=`
      <div class="enemy-list">
        ${enemies.map((e,i)=>`<div class="enemy-card ${e.hp<=0?"defeated":state.dungeon.targetIndex===i?"selected":""}" data-target="${i}">
          <h2>${escapeHtml(e.name)}${e.instanceBoss?"【副本Boss】":e.boss?"【樓層主】":""}</h2>
          <div>生命 ${Math.max(0,e.hp)}／${e.maxHp}</div>
          <div class="bar" style="margin-top:8px"><span style="width:${Math.max(0,e.hp/e.maxHp*100)}%"></span></div>
          <div class="small" style="margin-top:8px">${e.hp<=0?"已擊倒":enemyStatusText(e)}</div>
          ${e.hp>0?`<div class="small" style="margin-top:6px">${state.dungeon.targetIndex===i?"目前目標":"點擊選擇目標"}</div>`:""}
        </div>`).join("")}
      </div>
      <div class="panel">
        <h3>${escapeHtml(p.name)}</h3>
        <div>生命 ${Math.floor(p.hp2/2)}／${Math.floor(maxHp2()/2)}　｜　氣力 ${p.spirit}／100　｜　防禦 ${defense()}</div>
        <div class="small">狀態：${playerStatusList().length?playerStatusList().join("、"):"正常"}</div>
        <div class="actions">
          <button id="attack" class="primary">攻擊</button>
          <button id="defend">防禦</button>
          <button id="combatItem">使用物品</button>
          <button id="callSpirit" class="spirit" ${equippedSpirits().length===0?"disabled":""}>呼喚精靈</button>
          ${state.player.profession?`<button id="professionCombat" class="spirit" ${professionCombatSkills().length?"":"disabled"}>職業技能</button>`:""}
          <button id="flee" ${enemies.some(e=>e.instanceBoss)?"disabled":""}>${enemies.some(e=>e.instanceBoss)?"副本王無法逃跑":enemies.some(e=>e.boss)?"繞過樓層主":"逃跑"}</button>
        </div>
        <p class="small">不同武器有各自的攻擊方式；樓層主可以繞過，BOSS副本則無法逃跑。</p>
      </div>
      <div class="panel">
        <h3>戰鬥紀錄</h3>
        ${renderLog()}
      </div>
    `;
    document.querySelectorAll("[data-target]").forEach(card=>card.onclick=()=>setTarget(Number(card.dataset.target)));
    document.getElementById("attack").onclick=()=>playerTurn("attack");
    document.getElementById("defend").onclick=()=>playerTurn("defend");
    document.getElementById("combatItem").onclick=()=>{modal={type:"combatItems"};renderModal()};
    document.getElementById("callSpirit").onclick=()=>{modal={type:"spirits"};renderModal()};
    if(document.getElementById("professionCombat"))document.getElementById("professionCombat").onclick=()=>{modal={type:"professionSkills"};renderModal()};
    document.getElementById("flee").onclick=tryFlee;
  }

  function playerActionBlocked(){
    const st=normalizePlayerStatus(state.player.status);
    if(st.petrify>0 && Math.random()<.55){log("石化使你的身體僵硬，本回合無法行動。","bad");return true;}
    if(st.sleep>0 && Math.random()<.45){log("睡意壓過意識，你錯失了行動機會。","bad");return true;}
    if(st.paralysis>0 && Math.random()<.45){log("麻痺使你無法順利行動。","bad");return true;}
    if(st.confusion>0){
      const r=Math.random();
      if(r<.25){const d=rand(2,5);state.player.hp2-=d*2;log(`你在混亂中傷到自己，失去${d}點生命。`,"bad");return true;}
      if(r<.48){log("你在混亂中做出了錯誤動作。","bad");return true;}
    }
    return false;
  }

  function playerTurn(action){
    if(!hasCombat())return;
    if(playerActionBlocked()){
      if(state.player.hp2<=0){playerDeath();return;}
      enemyTurn();return;
    }
    if(action==="defend"){
      state.player.defending=true;
      log("你壓低重心，準備承受敵群的攻擊。");
      enemyTurn();
      return;
    }
    if(action==="attack"){
      performPlayerAttack();
      if(!hasCombat()){victory();return;}
      enemyTurn();
    }
  }

  function mainWeapon(){
    const r=state.equipment.right,l=state.equipment.left;
    if(r && r.kind==="weapon") return r;
    if(l && !l.linkedTo && l.kind==="weapon") return l;
    return null;
  }
  function offWeapon(){
    const m=mainWeapon();
    const r=state.equipment.right,l=state.equipment.left;
    if(m===r && l && !l.linkedTo && l.kind==="weapon") return l;
    if(m===l && r && r.kind==="weapon") return r;
    return null;
  }
  function weaponMasteryBonus(w){return w?Math.floor((state.player.mastery?.[w.weaponType]||0)/20):0;}
  function attackTargetsForWeapon(w){
    const living=livingEnemies();
    if(!w || living.length<=1) return [selectedEnemy()||living[0]].filter(Boolean);
    if(w.weaponType==="弓"){
      const count=Math.min(living.length,rand(2,Math.min(3,living.length)));
      return shuffleCopy(living).slice(0,count);
    }
    if(w.weaponType==="迴力鏢"||w.weaponType==="迴旋刃"){
      // 畫面敵人由左至右排列；迴旋刃固定由最右側開始，依序掃向左側全體。
      return combatEnemies().filter(e=>e&&e.hp>0).reverse();
    }
    return [selectedEnemy()||living[0]].filter(Boolean);
  }
  function damageOneTarget(w,target,mult=1,label=""){
    if(!target||target.hp<=0)return;
    const min=w?w.min:1,max=w?w.max:2;
    const drunkPenalty=(state.player.status?.drunk||0)>0?.15:0;
    const confusionPenalty=(state.player.status?.confusion||0)>0?.06:0;
    const hitChance=clamp(.90+(w?.hit||0)+(effectiveStat("dex")-target.dex)*.015-drunkPenalty-confusionPenalty,.60,.98);
    if(Math.random()>hitChance){log(`你的${w?w.weaponType:"爪擊"}${label}落空了。`,"bad");return;}
    let raw=rand(min,max)+Math.floor(effectiveStat("str")/2)+weaponMasteryBonus(w)+attackBonus();
    const crit=Math.random()<clamp(.05+effectiveStat("dex")*.006+critBonus(),.05,.65);
    if(crit)raw=Math.round(raw*1.5);
    raw=Math.max(1,Math.round(raw*mult));
    const dealt=Math.max(1,raw-Math.max(0,monsterEffectiveDef(target)-(w?.armorPen||0)));
    target.hp-=dealt;
    log(`${crit?"你抓住破綻，":""}${label}${target.name}受到${dealt}點傷害。`,crit?"good":"");
    if(w?.spirit && Math.random()<(.12+(w.spiritMod||0)))triggerSpirit(w.spirit,"weapon",target);
    if(target.status.sleep>0 && Math.random()<.5){target.status.sleep=0;log(`${target.name}受到攻擊後驚醒。`);}
  }

  function performPlayerAttack(){
    const w=mainWeapon();
    const targets=attackTargetsForWeapon(w);
    const multi=targets.length>1;
    const hits=w?(w.hits||1):1;
    if(w?.weaponType==="弓"&&multi) log(`你拉滿弓弦，箭矢射向${targets.length}個隨機目標。`);
    if(w?.weaponType==="迴力鏢"||w?.weaponType==="迴旋刃"){
      log(`迴力鏢從敵方最右側切入，依序掃過${targets.length}個敵人。`);
      let mult=.92+Math.random()*.14;
      targets.forEach((t,i)=>{
        if(i>0) mult*=.72+Math.random()*.18;
        damageOneTarget(w,t,Math.max(.28,mult),`第${i+1}擊：`);
      });
    }else if(targets.length===1){
      for(let i=0;i<hits;i++){if(targets[0].hp<=0)break;damageOneTarget(w,targets[0],1);}
    }else{
      const mult=w?.weaponType==="弓"?.74:1;
      targets.forEach(t=>damageOneTarget(w,t,mult,""));
    }
    const pursuitTarget=selectedEnemy()||livingEnemies()[0];
    if(learnedProfessionSkill("pursuit")&&state.player.profession==="龍脊戰衛"&&pursuitTarget&&Math.random()<.22){
      damageOneTarget(w,pursuitTarget,.55,"追刃：");
    }
    const off=offWeapon();
    const target=selectedEnemy()||livingEnemies()[0];
    const offChance=learnedProfessionSkill("dualBlade")&&state.player.profession==="龍脊戰衛"?.60:.30;
    if(off && target && Math.random()<offChance){
      const raw=Math.max(1,Math.floor((rand(off.min,off.max)+Math.floor(effectiveStat("str")/3)+weaponMasteryBonus(off)+attackBonus())/2));
      const dealt=Math.max(1,raw-monsterEffectiveDef(target));target.hp-=dealt;
      log(`副手追擊${target.name}，造成${dealt}點傷害。`);
      if(off.spirit && !(learnedProfessionSkill("dualBlade")&&state.player.profession==="龍脊戰衛") && Math.random()<(.08+(off.spiritMod||0)))triggerSpirit(off.spirit,"weapon",target);
    }
    if(state.player.profession==="荒魂獵手"&&learnedProfessionSkill("poisonCoat")&&(state.player.professionRuntime?.poisonCoat||0)>0){
      const t=selectedEnemy()||livingEnemies()[0];if(t&&t.hp>0&&Math.random()<.35){t.status.poison=Math.max(t.status.poison||0,3);log(`${t.name}受到淬毒武器侵蝕，陷入中毒。`,"good");}
    }
    ensureTarget();
  }

  function triggerSpirit(type,source,target=selectedEnemy()){
    const name=String(type||"");
    // 舊版簡稱相容
    if(name==="治療"){
      const heal=source==="active"?15:6;healPlayer(heal);log(`治療精靈使你恢復${heal}點生命。`,"spirit");return true;
    }
    if(name==="混亂"||name==="睡眠"||name==="麻痺"||name==="中毒"){
      const key=({"混亂":"confusion","睡眠":"sleep","麻痺":"paralysis","中毒":"poison"})[name];
      if(target&&target.hp>0){target.status[key]=Math.max(target.status[key]||0,key==="poison"?3:2);log(`${target.name}陷入${playerStatusLabel(key)}。`,"spirit");return true;}
      return false;
    }
    if(name==="光的精靈"){state.player.spiritGuard.absorb=(state.player.spiritGuard.absorb||0)+1;log("光的精靈形成光幕，將吸收下一次攻擊。","spirit");return true;}
    if(name==="鏡子的精靈"){state.player.spiritGuard.reflect=(state.player.spiritGuard.reflect||0)+1;log("鏡子的精靈展開鏡面，將反射下一次直接攻擊。","spirit");return true;}
    if(name==="守護的精靈"){state.player.spiritGuard.nullify=(state.player.spiritGuard.nullify||0)+2;log("守護的精靈形成結界，接下來2次攻擊將無效。","spirit");return true;}
    if(/高等淨化精靈/.test(name)) return clearPlayerStatus("all");
    if(spiritIsCleanse(name)){
      const key=spiritStatusKey(name);return key?clearPlayerStatus(key):false;
    }
    if(spiritIsHealing(name)){
      const heal=8+spiritLevel(name)*7;healPlayer(heal);log(`${name}使你恢復${heal}點生命。`,"spirit");return true;
    }
    if(spiritIsRevive(name)){
      log(`${name}的力量會在你氣絕時自動回應。`,"spirit");return true;
    }
    const key=spiritStatusKey(name);
    if(key){
      const targets=spiritIsGroup(name)?livingEnemies():[target||selectedEnemy()].filter(Boolean);
      if(!targets.length)return false;
      const duration=spiritDuration(name);
      let success=0;
      targets.forEach(t=>{
        if(t.hp<=0)return;
        const chance=clamp(spiritInflictChance(name)+(source==="active"?.12:0),.55,.98);
        if(Math.random()<chance){t.status[key]=Math.max(t.status[key]||0,duration);success++;log(`${t.name}受到${name}影響，陷入${playerStatusLabel(key)}。`,"spirit");}
        else log(`${t.name}抵抗了${name}。`);
      });
      return success>0;
    }
    return false;
  }

  function tryMonsterSkill(e){
    const chance=e.boss?.38:.22;
    if(Math.random()>=chance)return false;
    const allies=livingEnemies().filter(x=>x!==e);
    const r=Math.random();
    if(allies.length && r<.38){
      if(Math.random()<.5){
        livingEnemies().forEach(a=>{const b=ensureMonsterBuffs(a);b.atk=Math.max(b.atk,e.boss?2:1);b.atkTurns=2;});
        log(`${e.name}發出戰吼，怪物方攻擊力暫時提升。`,"bad");
      }else{
        livingEnemies().forEach(a=>{const b=ensureMonsterBuffs(a);b.def=Math.max(b.def,e.boss?2:1);b.defTurns=2;});
        log(`${e.name}施放硬化祝福，怪物方防禦暫時提升。`,"bad");
      }
      return true;
    }
    if(allies.length && r<.55){
      const t=allies.sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];
      const heal=Math.max(3,Math.round(t.maxHp*(e.boss?.22:.14)));t.hp=Math.min(t.maxHp,t.hp+heal);
      log(`${e.name}施放治癒，${t.name}恢復${heal}點生命。`,"bad");return true;
    }
    let status;
    if(/毒牙/.test(e.name))status="poison";
    else if(/迷霧|祭司/.test(e.name))status=pick(["confusion","sleep","drunk"]);
    else if(e.boss)status=pick(["poison","petrify","confusion","drunk","sleep"]);
    else status=pick(["poison","confusion","drunk"]);
    applyPlayerStatus(status,e.name);
    log(`${e.name}施放了異常術式。`,"bad");return true;
  }

  function applyPlayerProtectionAgainstAttack(e,dmg){
    const g=state.player.spiritGuard||{absorb:0,reflect:0,nullify:0};
    if(g.nullify>0){g.nullify--;log("守護精靈的結界使這次攻擊完全無效。","spirit");return true;}
    if(g.reflect>0){g.reflect--;e.hp-=dmg;log(`鏡子的精靈反射攻擊，${e.name}反受${dmg}點傷害。`,"spirit");return true;}
    if(g.absorb>0){g.absorb--;healPlayer(dmg);log(`光的精靈吸收攻擊，轉化為${dmg}點生命。`,"spirit");return true;}
    return false;
  }

  function bossSpecialDamage(e,mult=1.35){
    let dmg=Math.max(2,Math.round(monsterEffectiveAtk(e)*mult)-Math.floor(defense()*.55));
    if(state.player.defending)dmg=Math.max(1,Math.floor(dmg*.5));
    if(blockBonus()>0&&Math.random()<clamp(blockBonus(),0,.60)){dmg=Math.max(1,Math.floor(dmg*.5));log("你以裝備格擋了BOSS攻勢的一部分。","good");}
    if(applyPlayerProtectionAgainstAttack(e,dmg))return 0;
    state.player.hp2-=dmg*2;return dmg;
  }
  function executeBossSpecial(e){
    const p=bossProfile(e),phase=updateBossPhase(e);
    const skill=e.telegraph?.skill||p.skill;
    if(p.kind==="mist"){
      const dmg=bossSpecialDamage(e,phase>=3?1.18:1.02);
      if(dmg>0){log(`${bossDisplayName(e)}施展【${skill}】，幽霧侵蝕你並造成${dmg}點傷害！`,"bad");applyPlayerStatus(pick(["confusion","sleep","drunk"]),bossDisplayName(e),phase>=3?4:3);}
    }else if(p.kind==="poison"){
      const dmg=bossSpecialDamage(e,phase>=3?1.48:1.28);
      if(dmg>0){log(`${bossDisplayName(e)}施展【${skill}】，腐毒洪流造成${dmg}點傷害！`,"bad");applyPlayerStatus("poison",bossDisplayName(e),phase>=3?5:4);}
    }else if(p.kind==="stone"){
      const dmg=bossSpecialDamage(e,phase>=3?1.72:1.48);
      if(dmg>0)log(`${bossDisplayName(e)}施展【${skill}】，地面崩裂造成${dmg}點傷害！`,"bad");
    }else{
      const dmg=bossSpecialDamage(e,phase>=3?1.65:1.42);
      if(dmg>0)log(`${bossDisplayName(e)}施展【${skill}】，猛烈衝擊造成${dmg}點傷害！`,"bad");
    }
    e.telegraph=null;
  }
  function tryBossTelegraph(e){
    if(!e?.boss)return false;
    const phase=updateBossPhase(e);
    if(e.telegraph){executeBossSpecial(e);return true;}
    const chance=phase>=3?.44:phase>=2?.35:.27;
    if(Math.random()>=chance)return false;
    const p=bossProfile(e);e.telegraph={skill:p.skill,at:Date.now()};
    log(`${bossDisplayName(e)}開始蓄力【${p.skill}】！`,"bad");
    return true;
  }

  function enemyActs(e){
    if(!e||e.hp<=0)return;
    ensureMonsterBuffs(e);
    if(e.status.poison>0){
      const pd=Math.max(1,Math.round(e.maxHp*.05));e.hp-=pd;e.status.poison--;
      log(`${e.name}受到毒素侵蝕，失去${pd}點生命。`,"good");
      if(e.hp<=0)return;
    }
    if(e.status.sleep>0){e.status.sleep--;log(`${e.name}仍在沉睡。`,"good");tickMonsterBuffs(e);return;}
    if(e.status.petrify>0){e.status.petrify--;if(Math.random()<.70){log(`${e.name}被石化束縛，無法行動。`,"good");tickMonsterBuffs(e);return;}}
    if(e.status.paralysis>0){e.status.paralysis--;if(Math.random()<.55){log(`${e.name}因麻痺無法行動。`,"good");tickMonsterBuffs(e);return;}}
    if(e.status.confusion>0){
      e.status.confusion--;const r=Math.random();
      if(r<.4){const d=rand(2,5);e.hp-=d;log(`${e.name}在混亂中傷到自己，失去${d}點生命。`,"good");tickMonsterBuffs(e);return;}
      if(r<.75){log(`${e.name}在混亂中浪費了回合。`,"good");tickMonsterBuffs(e);return;}
    }
    if(state.player.profession==="荒魂獵手"&&state.player.professionRuntime?.trapArmed){
      state.player.professionRuntime.trapArmed=false;const td=Math.max(3,Math.floor(e.maxHp*.12));e.hp-=td;e.status.paralysis=Math.max(e.status.paralysis||0,1);log(`獸骨陷阱咬住${e.name}，造成${td}點傷害並限制其行動。`,"good");tickMonsterBuffs(e);return;
    }
    if(tryBossTelegraph(e)){tickMonsterBuffs(e);return;}
    if(tryMonsterSkill(e)){tickMonsterBuffs(e);return;}
    const drunkPenalty=(e.status.drunk||0)>0?.12:0;
    if(e.status.drunk>0)e.status.drunk--;
    const hit=clamp(.88+(e.dex-effectiveStat("dex"))*.015-drunkPenalty-dodgeBonus(),.45,.96);
    if(Math.random()>hit){log(`${e.name}的攻擊被你避開。`,"good");tickMonsterBuffs(e);return;}
    let dmg=Math.max(1,rand(Math.max(1,monsterEffectiveAtk(e)-2),monsterEffectiveAtk(e)+1)-defense());
    if(state.player.defending)dmg=Math.max(1,Math.floor(dmg*.5));
    if(blockBonus()>0 && Math.random()<clamp(blockBonus(),0,.60)){dmg=Math.max(1,Math.floor(dmg*.5));log("你以裝備格擋了部分傷害。","good");}
    if(applyPlayerProtectionAgainstAttack(e,dmg)){tickMonsterBuffs(e);return;}
    state.player.hp2-=dmg*2;log(`${e.name}對你造成${dmg}點傷害。`,"bad");
    if(e.poisonChance&&Math.random()<e.poisonChance)applyPlayerStatus("poison",e.name);
    triggerArmorSpirits(e);
    tickMonsterBuffs(e);
  }

  function enemyTurn(){
    if(!hasCombat())return;
    if(!state.combatMeta)state.combatMeta={turns:0,startedAt:Date.now()};
    state.combatMeta.turns=Math.max(0,Number(state.combatMeta.turns||0))+1;
    const acting=[...livingEnemies()].sort((a,b)=>b.dex-a.dex);
    for(const e of acting){
      enemyActs(e);
      if(state.player.hp2<=0){playerDeath();return;}
    }
    if(!hasCombat()){victory();return;}
    state.player.defending=false;
    if((state.player.status?.poison||0)>0){
      const poisonDamage=state.player.race==="矮人"?1:2;
      state.player.hp2-=poisonDamage*2;
      log(`中毒狀態持續侵蝕你，失去${poisonDamage}點生命。`,"bad");
    }
    const regenHp=Math.max(0,equipBonus("hpRegen"));
    const regenSp=Math.max(0,equipBonus("spiritRegen"));
    if(regenHp>0 && state.player.hp2<maxHp2()){healPlayer(regenHp);log(`裝備效果使你恢復${regenHp}點生命。`,"good");}
    if(regenSp>0 && state.player.spirit<100){state.player.spirit=clamp(state.player.spirit+regenSp,0,100);log(`裝備效果使你恢復${regenSp}點氣力。`,"spirit");}
    tickPlayerStatuses();
    tickProfessionRound();
    if(state.player.hp2<=0){playerDeath();return;}
    ensureTarget();autoSave();render();
  }

  function triggerArmorSpirits(attacker){
    for(const it of getAllEquipped().filter(i=>i.kind==="armor"||i.kind==="shield"||i.kind==="accessory")){
      if(it.spirit&&Math.random()<.08)triggerSpirit(it.spirit,"armor",attacker);
    }
  }

  function enemyStatusText(e){
    const s=[];if(e.status.confusion>0)s.push("混亂");if(e.status.sleep>0)s.push("睡眠");if(e.status.paralysis>0)s.push("麻痺");if(e.status.poison>0)s.push("中毒");if(e.status.petrify>0)s.push("石化");if(e.status.drunk>0)s.push("酒醉");
    const b=ensureMonsterBuffs(e);if(b.atk>0)s.push(`攻擊強化+${b.atk}`);if(b.def>0)s.push(`防禦強化+${b.def}`);
    return s.length?"狀態："+s.join("、"):"目前無特殊狀態";
  }

  function equippedSpirits(){return getAllEquipped().filter(i=>i.spirit);}

  function callSpirit(itemId){
    const it=getAllEquipped().find(i=>i.id===itemId);if(!it||!it.spirit)return;
    const inCombat=hasCombat();
    if(!inCombat && !spiritCanUseOutOfCombat(it.spirit)){
      log(`${it.spirit}需要敵對目標，非戰鬥狀態無法施放。`,"bad");modal=null;render();return;
    }
    const cost=spiritCost();
    const payment=trySpendSpirit(cost);
    if(!payment.ok){log("你的氣力不足，無法與精靈溝通。","bad");modal=null;render();return;}
    if(payment.free) log(`${state.player.race}的天賦產生共鳴，本次呼喚沒有消耗氣力。`,"spirit");
    else log(`你消耗${cost}點氣力，呼喚${it.name}中的${it.spirit}。`,"spirit");
    triggerSpirit(it.spirit,"active",selectedEnemy());modal=null;
    if(inCombat){
      if(!hasCombat()){victory();return;}
      enemyTurn();
    }else{autoSave();render();}
  }

  function gainWeaponMastery(enemyCount){
    const w=mainWeapon();if(!w)return;
    if(!state.player.mastery)state.player.mastery={};
    const before=state.player.mastery[w.weaponType]||0;
    const gain=Math.max(1,enemyCount);
    state.player.mastery[w.weaponType]=Math.min(100,before+gain);
    if(Math.floor(before/20)<Math.floor(state.player.mastery[w.weaponType]/20))log(`${w.weaponType}熟練度提升，攻擊運用更加純熟。`,"good");
  }

  function awardDrop(item,forcedLabel=null,cls=null){
    let bonusCopy=null;
    if(state.player?.profession==="荒魂獵手"&&learnedProfessionSkill("salvage")&&item?.kind==="material"&&Math.random()<.20){
      if(item.qty){item.qty+=1;}else{bonusCopy=deepCopy(item);bonusCopy.id=uid();}
    }
    const ok=addInventory(item);
    if(ok){
      const label=forcedLabel||`${item.name}${item.qty&&item.qty>1?` ×${item.qty}`:""}${item.spirit?`（精靈附加：${item.spirit}）`:""}`;
      log(`你獲得了${label}。`,cls||(item.kind==="material"?"spirit":"good"));
      if(bonusCopy&&addInventory(bonusCopy))log("拾荒本能讓你從周遭又找到了一份材料。","good");
      else if(state.player?.profession==="荒魂獵手"&&learnedProfessionSkill("salvage")&&item?.kind==="material"&&item.qty&&forcedLabel)log("拾荒本能讓你多找到了一份材料。","good");
    }else{
      log(`${item.name}掉落在你面前，但背包已滿，無法拾取。`,"bad");
    }
    return ok;
  }

  function victory(){
    const enemies=combatEnemies();
    const bossEnemy=enemies.find(e=>e.boss);
    const boss=!!bossEnemy;
    const exp=enemies.reduce((sum,e)=>sum+(e.exp||0),0);
    const gold=enemies.reduce((sum,e)=>sum+rand(e.gold[0],e.gold[1]),0);
    const combatTurns=Math.max(1,Number(state.combatMeta?.turns||0));
    state.player.gold+=gold;gainExp(exp);gainWeaponMastery(enemies.length);
    log(`你擊敗了${boss?bossEnemy.name:(enemies.length>1?"整個敵群":enemies[0].name)}，獲得${exp}經驗與${gold}金幣。`,"gold");
    clearCombatStatuses();
    const instanceBoss=!!bossEnemy?.instanceBoss;
    if(instanceBoss){
      const rewards=[];
      const targetDrops=rand(3,6);
      let drops=0;
      const legendary=generateLootAtRarity("legendary");
      if(awardDrop(legendary,`${legendary.name}（傳說） ×1`,"good"))rewards.push(`${legendary.name}（傳說）`);
      drops++;
      const stoneQty=30*refinementStoneMultiplier();
      if(awardDrop(createStack(REFINEMENT_STONE,stoneQty),`精煉石 ×${stoneQty}${state.player.race==="矮人"?"（工匠專精加倍）":""}`,"spirit"))rewards.push(`精煉石 ×${stoneQty}`);
      drops++;
      const spiritAttachWon=Math.random()<.10;
      if(spiritAttachWon&&drops<targetDrops){
        const ss=createSpiritAttachStone();if(awardDrop(ss,`${ss.name} ×1`,"spirit"))rewards.push(ss.name);drops++;
      }
      while(drops<targetDrops){
        let item=generateBattleDrop(Math.max(1,state.player.level),true,drops);
        if(item.key==="refineStone")item.qty*=refinementStoneMultiplier();
        if(awardDrop(item))rewards.push(`${item.name}${item.qty&&item.qty>1?` ×${item.qty}`:""}`);drops++;
      }
      log(`副本王本次共掉落${targetDrops}件物品。`,"gold");
      const victoryData={type:"bossVictory",bossName:bossDisplayName(bossEnemy),title:bossProfile(bossEnemy).title,exp,gold,rewards,turns:combatTurns,instanceBoss:true};
      state.dungeon.enemies=[];state.dungeon.enemy=null;state.dungeon.targetIndex=0;
      state.dungeon.pendingProgress=false;state.player.defending=false;
      state.location="town";state.shopStock=generateShopStock();refreshTownClown(false);currentView="town";
      state.combatMeta={turns:0,startedAt:0};modal=victoryData;autoSave();render();return;
    }
    if(boss){
      const rewards=[];
      const targetDrops=rand(3,6);
      let drops=0;
      const stoneQty=5*refinementStoneMultiplier();
      if(awardDrop(createStack(REFINEMENT_STONE,stoneQty),`精煉石 ×${stoneQty}${state.player.race==="矮人"?"（工匠專精加倍）":""}`,"spirit"))rewards.push(`精煉石 ×${stoneQty}`);
      drops++;
      if(Math.random()<.10 && drops<targetDrops){
        if(awardDrop(createStack(BOSS_SUMMON_STONE,1),"稀有的BOSS召喚石 ×1","spirit"))rewards.push("BOSS召喚石 ×1");drops++;
      }
      while(drops<targetDrops){
        let item=generateBattleDrop(state.dungeon.floor,true,drops);
        if(item.key==="refineStone")item.qty*=refinementStoneMultiplier();
        if(awardDrop(item))rewards.push(`${item.name}${item.qty&&item.qty>1?` ×${item.qty}`:""}`);drops++;
      }
      log(`樓層主本次共掉落${targetDrops}件物品。`,"gold");
      const floor=Number(bossEnemy.bossFloor||state.dungeon.floor);
      state.dungeon.bossDefeats[floor]=Number(state.dungeon.bossDefeats[floor]||0)+1;
      log(`樓層主記住了這次敗北。下次在第${floor}層再戰時，能力會變得更加強大。`,"bad");
      const victoryData={type:"bossVictory",bossName:bossDisplayName(bossEnemy),title:bossProfile(bossEnemy).title,exp,gold,rewards,turns:combatTurns,instanceBoss:false,floor};
      state.dungeon.enemies=[];state.dungeon.enemy=null;state.dungeon.targetIndex=0;
      if(state.dungeon.pendingProgress)state.dungeon.progress++;
      state.dungeon.pendingProgress=false;state.player.defending=false;currentView="dungeon";
      state.combatMeta={turns:0,startedAt:0};modal=victoryData;autoSave();render();return;
    }
    const dropCount=rollDropCount(false,enemies.length);
    for(let i=0;i<dropCount;i++){
      const item=generateBattleDrop(state.dungeon.floor,false,i);
      if(item.key==="refineStone")item.qty*=refinementStoneMultiplier();
      awardDrop(item);
    }
    if(dropCount===0)log("怪物沒有留下可用的道具。");
    state.dungeon.enemies=[];state.dungeon.enemy=null;state.dungeon.targetIndex=0;
    if(state.dungeon.pendingProgress)state.dungeon.progress++;
    state.dungeon.pendingProgress=false;state.player.defending=false;state.combatMeta={turns:0,startedAt:0};currentView="dungeon";autoSave();render();
  }

  function rollDropCount(boss,enemyCount=1){
    if(boss) return Math.random()<.40?3:2;
    const r=Math.random();
    const bonus=Math.min(.18,(enemyCount-1)*.09);
    if(r<Math.max(.05,.18-bonus)) return 0;
    if(r<Math.max(.48,.68-bonus)) return 1;
    if(r<.92-bonus/2) return 2;
    return 3;
  }

  function generateBattleDrop(floor,boss,index){
    if(boss && index===0) return generateLoot(floor,true);
    const r=Math.random();
    if(r<.52) return generateLoot(floor,boss);
    if(r<.87) return createStack(pick(BATTLE_SUPPLIES),1);
    return createStack(REFINEMENT_STONE,boss&&Math.random()<.35?2:1);
  }

  function generateLoot(floor,boss){
    return generateLootAtRarity(rarityForFloor(floor,boss));
  }

  function generateLootAtRarity(rarity){
    const r=Math.random();
    if(r<.48) return createItemFromWeapon(pick(WEAPON_TEMPLATES),rarity);
    if(r<.76) return createItemFromArmor(pick(ARMOR_TEMPLATES),rarity);
    if(r<.90) return createItemFromAccessory(pick(ACCESSORY_TEMPLATES),rarity);
    return createHandGear(pick(HAND_GEAR),rarity);
  }

  function gainExp(amount){
    const p=state.player;p.exp+=amount;
    while(p.exp>=xpNeeded(p.level)){
      p.exp-=xpNeeded(p.level);
      p.level++;p.unspent++;
      p.hp2=maxHp2();
      log(`你升到了${p.level}級，並獲得1點可分配能力。`,"good");
      grantProfessionSkillPoints();
    }
  }

  function attemptAutoRevive(){
    if(!hasCombat()||state.player.combatFlags?.revived)return false;
    const spiritItem=equippedSpirits().find(i=>spiritIsRevive(i.spirit));
    const relicItem=getAllEquipped().find(i=>i.reviveOnce);
    const item=spiritItem||relicItem;
    if(!item)return false;
    state.player.combatFlags={...(state.player.combatFlags||{}),revived:true};
    if(spiritItem){
      const name=String(item.spirit);
      const lv=spiritLevel(name);
      const amount=({1:100,2:300,3:500,4:700})[lv]||100;
      state.player.hp2=Math.min(maxHp2(),amount*2);
      if(/復活光精靈/.test(name))state.player.spiritGuard.absorb=(state.player.spiritGuard.absorb||0)+1;
      if(/復活鏡精靈/.test(name))state.player.spiritGuard.reflect=(state.player.spiritGuard.reflect||0)+1;
      if(/復活守護精靈/.test(name))state.player.spiritGuard.nullify=(state.player.spiritGuard.nullify||0)+2;
      log(`${item.name}中的${name}在氣絕瞬間甦醒，你恢復了${Math.floor(state.player.hp2/2)}點生命！`,"spirit");
    }else{
      state.player.hp2=Math.max(2,Math.round(maxHp2()*.5));
      log(`${item.name}在氣絕瞬間護住你的生命，你以${Math.floor(state.player.hp2/2)}點生命重新站起！`,"spirit");
    }
    return true;
  }

  function playerDeath(){
    if(attemptAutoRevive()){autoSave();render();return;}
    const clownEligible=state.location==="dungeon"&&Number(state.dungeon.runMaxFloor||state.dungeon.floor||1)>=5;
    const lost=Math.floor(state.player.gold*.10);
    state.player.gold-=lost;
    state.player.hp2=maxHp2();
    state.player.spirit=100;
    state.player.status=defaultPlayerStatus();
    state.dungeon.enemies=[];state.dungeon.enemy=null;state.dungeon.targetIndex=0;
    state.dungeon.floor=1;
    state.dungeon.progress=0;
    state.dungeon.pendingProgress=false;state.combatMeta={turns:0,startedAt:0};
    log(`${state.location==="bossInstance"?"你在BOSS副本中倒下，召喚石的力量也隨之消散":"你在地下城中倒下，被巡邏隊帶回龍脊鎮"}。你遺失了${lost}金幣。`,"bad");
    state.location="town";
    state.shopStock=generateShopStock();
    refreshTownClown(clownEligible);
    currentView="town";
    autoSave();render();
  }

  function tryFlee(){
    const enemies=livingEnemies();if(!enemies.length)return;
    if(enemies.some(e=>e.instanceBoss)){
      log("召喚石形成的封閉領域阻止你逃離副本。","bad");render();return;
    }
    if(enemies.some(e=>e.boss)){
      const bossName=enemies.find(e=>e.boss)?.name||"樓層主";
      log(`你避開${bossName}的領域，放棄本層獎勵並前往下一層。`,"spirit");
      clearCombatStatuses();
      state.dungeon.enemies=[];state.dungeon.enemy=null;state.dungeon.targetIndex=0;
      state.dungeon.pendingProgress=false;state.combatMeta={turns:0,startedAt:0};
      state.dungeon.floor++;
      state.dungeon.runMaxFloor=Math.max(Number(state.dungeon.runMaxFloor||1),state.dungeon.floor);
      state.dungeon.progress=0;
      currentView="dungeon";autoSave();render();return;
    }
    const enemyDex=Math.max(...enemies.map(e=>e.dex));
    const chance=clamp(.55+(effectiveStat("dex")-enemyDex)*.04-(enemies.length-1)*.07,.15,.90);
    if(Math.random()<chance){
      log("你成功脫離敵群。","good");
      clearCombatStatuses();
      state.dungeon.enemies=[];state.dungeon.enemy=null;state.dungeon.targetIndex=0;state.dungeon.pendingProgress=false;
      currentView="dungeon";autoSave();render();
    }else{log("逃跑失敗！","bad");enemyTurn();}
  }

  function findChest(){
    const locked=Math.random()<.35;
    if(locked && !hasItemKey("chestKey")){
      log("你找到一只上鎖的寶箱，但沒有合適的鑰匙。");
      return;
    }
    if(locked) consumeByKey("chestKey");
    if(Math.random()<.55){
      const gold=rand(8,18)+state.dungeon.floor*2;
      state.player.gold+=gold;log(`你從寶箱中找到${gold}金幣。`,"gold");
    }else{
      const loot=generateLoot(state.dungeon.floor,false);
      if(addInventory(loot)) log(`你從寶箱中找到${loot.name}${loot.spirit?`，其中寄宿著${loot.spirit}`:""}。`,"good");
      else log(`${loot.name}就在寶箱裡，但你的背包已滿，無法帶走。`,"bad");
    }
  }

  function spiritEvent(){
    const cost=10;
    log("你在石壁深處聽見細微的低語。","spirit");
    const payment=trySpendSpirit(cost);
    if(payment.ok && Math.random()<.72){
      if(payment.free) log(`${state.player.race}的血脈自然回應了低語，本次感應沒有消耗氣力。`,"spirit");
      else log(`你消耗${cost}點氣力集中精神。`,"spirit");
      const r=Math.random();
      if(r<.35){
        const heal=rand(5,12);healPlayer(heal);log(`精靈替你恢復${heal}點生命。`,"spirit");
      }else if(r<.70){
        const loot=generateLoot(state.dungeon.floor,false);loot.spirit=nextSpirit();
        if(addInventory(loot)) log(`低語引導你找到一件寄宿${loot.spirit}的裝備：${loot.name}。`,"spirit");
        else log(`精靈引導你找到${loot.name}，但背包已滿，無法帶走。`,"bad");
      }else{
        state.player.spirit=clamp(state.player.spirit+20,0,100);
        log("精靈回應了你的呼喚，氣力有所恢復。","spirit");
      }
    }else{
      log(payment.ok?"低語很快消散，你沒有得到明確回應。":"你的氣力不足，無法回應那道低語。");
    }
  }

  function trapEvent(){
    if(hasItemKey("trapKit")){
      consumeByKey("trapKit");
      log("陷阱解除工具替你擋下了一次危險。","good");
      return true;
    }
    const dmg=rand(3,8);
    state.player.hp2-=dmg*2;
    log(`你觸發了陷阱，失去${dmg}點生命。`,"bad");
    if(state.player.hp2<=0){
      playerDeath();
      return false;
    }
    return true;
  }

  function nextFloor(){
    state.dungeon.floor++;
    state.dungeon.runMaxFloor=Math.max(Number(state.dungeon.runMaxFloor||1),state.dungeon.floor);
    state.dungeon.progress=0;
    log(`你踏入地下城第${state.dungeon.floor}層。`);
    autoSave();render();
  }
  function resetDungeonRun(){
    state.dungeon.floor=1;
    state.dungeon.runMaxFloor=1;
    state.dungeon.progress=0;
    state.dungeon.enemies=[];
    state.dungeon.enemy=null;
    state.dungeon.targetIndex=0;
    state.dungeon.pendingProgress=false;
    state.dungeon.goldStatueActive=false;
  }
  function retreatOneFloor(){
    if(state.dungeon.floor>1){
      const from=state.dungeon.floor;
      state.dungeon.floor--;
      state.dungeon.progress=0;
      log(`你從第${from}層撤退到第${state.dungeon.floor}層，本層探索進度歸零。`);
      autoSave();render();return;
    }
    returnTown();
  }
  function returnTown(){
    const clownEligible=Number(state.dungeon.runMaxFloor||state.dungeon.floor||1)>=5;
    log("你離開地下城，返回龍脊鎮。本次地下城進度全部歸零。");
    resetDungeonRun();
    state.location="town";
    state.shopStock=generateShopStock();
    refreshTownClown(clownEligible);
    currentView="town";autoSave();render();
  }

  function restAtInn(){
    if(state.player.gold<5){log("你的金幣不足以支付住宿費。","bad");render();return;}
    state.player.gold-=5;
    state.player.hp2=maxHp2();state.player.spirit=100;
    log("你在旅店充分休息，生命與氣力完全恢復。","good");
    autoSave();render();
  }

  function renderSave(main){
    main.innerHTML=`
      <div class="panel">
        <h2>存檔管理</h2>
        <p>遊戲會自動存檔。建議偶爾匯出備份，避免瀏覽器資料被清除。</p>
        <div class="actions">
          <button id="manualSave" class="good">立即儲存</button>
          <button id="exportSave" class="primary">匯出存檔</button>
          <button id="importSave">匯入存檔</button>
          <button id="resetGame" class="danger">刪除存檔並重來</button>
        </div>
      </div>
    `;
    document.getElementById("manualSave").onclick=()=>{autoSave();log("已手動儲存。","good");render()};
    document.getElementById("exportSave").onclick=exportSave;
    document.getElementById("importSave").onclick=()=>document.getElementById("importFile").click();
    document.getElementById("resetGame").onclick=resetGame;
  }

  function exportSave(){
    autoSave();
    const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`龍脊深境_${state.player.name}_存檔.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  }
  function importSaveFile(ev){
    const f=ev.target.files[0];if(!f)return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const data=JSON.parse(reader.result);
        if(!data.player||!data.inventory||!data.equipment) throw new Error("格式不符");
        state=data;migrateState();
        localStorage.setItem(SAVE_KEY,JSON.stringify(state));
        currentView=hasCombat()?"combat":(state.location==="dungeon"?"dungeon":"town");
        modal=null;render();
      }catch(e){alert("存檔無法讀取："+e.message)}
    };
    reader.readAsText(f);
    ev.target.value="";
  }
  function resetGame(){
    if(!confirm("確定要刪除目前存檔並重新開始嗎？")) return;
    localStorage.removeItem(SAVE_KEY);
    state=makeInitialState();currentView="town";modal=null;render();
  }

  function useItem(id,inCombat){
    const it=state.inventory.find(x=>x.id===id);if(!it)return;
    if(it.key==="surpriseBox"){
      if(inCombat){log("戰鬥中無法慢慢拆驚喜箱。","bad");return;}
      openSurpriseBox(it);return;
    }
    if(it.returnTown){
      if(hasCombat()){log("戰鬥中無法使用返回卷軸。","bad");return;}
      removeInventoryItem(id,1);returnTown();return;
    }
    let used=false;
    if(it.heal){
      if(state.player.hp2<maxHp2()){healPlayer(it.heal);log(`你使用${it.name}，恢復${it.heal}點生命。`,"good");used=true}
    }
    if(it.spirit){
      if(state.player.spirit<100){state.player.spirit=clamp(state.player.spirit+it.spirit,0,100);log(`你使用${it.name}，恢復${it.spirit}點氣力。`,"spirit");used=true}
    }
    if(it.cure){
      if(it.cure==="all") used=clearPlayerStatus("all")||used;
      else used=clearPlayerStatus(it.cure)||used;
    }
    if(!used){log("目前不需要使用這個物品。");modal=null;render();return;}
    removeInventoryItem(id,1);
    modal=null;
    if(inCombat) enemyTurn(); else {autoSave();render();}
  }
  function healPlayer(amount){

  function buyProduct(index,products,stockKey){

  function refinableItems(){

  function refineRule(it){
    const next=(it.refine||0)+1;
    const stones=next<=3?1:(next<=6?2:3);
    const gold=next*10;
    const chance=next<=3?1:(next<=6?.80:(next<=8?.60:(next===9?.45:.30)));
    const label=chance===1?"穩定":chance>=.8?"良好":chance>=.6?"普通":chance>=.45?"困難":"極低";
    return {next,stones,gold,chance,label};
  }

  function alchemyMajorCategory(it){if(!it)return null;if(it.kind==="weapon")return "weapon";if(it.kind==="accessory")return "accessory";if(["armor","shield","focus"].includes(it.kind))return "armor";return null;}
  function randomAlchemyGear(category,rarity){
    if(category==="weapon")return createItemFromWeapon(pick(WEAPON_TEMPLATES),rarity);
    if(category==="accessory")return createItemFromAccessory(pick(ACCESSORY_TEMPLATES),rarity);
    if(category==="armor"){return Math.random()<.78?createItemFromArmor(pick(ARMOR_TEMPLATES),rarity):createHandGear(pick(HAND_GEAR),rarity);}
    return null;
  }
  function bulkAlchemyEligible(it){return isSellableGear(it)&&!["legendary","ancient"].includes(it.rarity||"common")&&!(it.refine>0)&&!it.spirit&&!it.surpriseExclusive;}
  function bulkAlchemyPlan(selectedRarities,continuous=false){
    const counts={};for(const r of ["common","fine","rare","epic"]){counts[r]={weapon:0,armor:0,accessory:0};}
    for(const it of state.inventory){const r=it.rarity||"common",c=alchemyMajorCategory(it);if(c&&counts[r]&&bulkAlchemyEligible(it)&&selectedRarities.includes(r))counts[r][c]++;}
    let consumed=0,produced=0;const order=["common","fine","rare","epic"];
    if(!continuous){for(const r of order){if(!selectedRarities.includes(r))continue;for(const c of Object.keys(counts[r])){const pairs=Math.floor(counts[r][c]/2);consumed+=pairs*2;produced+=pairs;}}}
    else{for(let i=0;i<order.length;i++){const r=order[i];if(i===0&&!selectedRarities.includes(r)&&!selectedRarities.some(x=>order.indexOf(x)<=i))continue;for(const c of Object.keys(counts[r])){const pairs=Math.floor(counts[r][c]/2);consumed+=pairs*2;produced+=pairs;if(i<order.length-1)counts[order[i+1]][c]+=pairs;}}}
    return {consumed,produced};
  }
  function performBulkAlchemy(selectedRarities,continuous=false){
    if(!selectedRarities.length){alert("請先勾選要鍊成的品質。");return;}
    const plan=bulkAlchemyPlan(selectedRarities,continuous);if(!plan.consumed){alert("目前沒有足夠的同品質、同大分類裝備可以合成。");return;}
    if(!confirm(`將消耗 ${plan.consumed} 件裝備，產生約 ${plan.produced} 件更高品質裝備。確定開始鍊成嗎？`))return;
    let totalConsumed=0,totalProduced=0;const order=["common","fine","rare","epic"];
    const poolIds=new Set(state.inventory.filter(it=>bulkAlchemyEligible(it)&&selectedRarities.includes(it.rarity||"common")).map(it=>it.id));
    const runStage=(rarity)=>{
      const next=nextRarityId(rarity,false);if(!next)return;
      for(const cat of ["weapon","armor","accessory"]){
        const items=state.inventory.filter(it=>poolIds.has(it.id)&&bulkAlchemyEligible(it)&&(it.rarity||"common")===rarity&&alchemyMajorCategory(it)===cat);
        for(let i=0;i+1<items.length;i+=2){
          const a=items[i],b=items[i+1];if(!state.inventory.some(x=>x.id===a.id)||!state.inventory.some(x=>x.id===b.id))continue;
          poolIds.delete(a.id);poolIds.delete(b.id);state.inventory=state.inventory.filter(x=>x.id!==a.id&&x.id!==b.id);
          const result=randomAlchemyGear(cat,next);if(result){addInventory(result);if(continuous&&bulkAlchemyEligible(result))poolIds.add(result.id);totalConsumed+=2;totalProduced++;}
        }
      }
    };
    if(continuous){for(const r of order)runStage(r);}else{for(const r of [...selectedRarities])runStage(r);}
    log(`鍊金爐吞沒${totalConsumed}件裝備，重新凝成${totalProduced}件更高品質裝備。`,"good");autoSave();renderAlchemyModal(document.getElementById("modalContent"));
  }

  function alchemyAttachSpirit(gearId,stoneId){
    const gear=state.inventory.find(i=>i.id===gearId),stone=state.inventory.find(i=>i.id===stoneId&&i.key==="spiritAttachStone");
    if(!gear||!stone){alert("請選擇裝備與精靈附加石。");return;}
    if(gear.spirit){alert("這件裝備已經寄宿精靈。");return;}
    gear.spirit=stone.storedSpirit;state.inventory.splice(state.inventory.indexOf(stone),1);
    log(`${gear.name}成功附加${gear.spirit}。`,"spirit");autoSave();renderAlchemyModal(document.getElementById("modalContent"));

  function alchemyFuseRarity(aId,bId){
    if(!aId||!bId||aId===bId){alert("請選擇兩件不同的裝備。");return;}
    const a=state.inventory.find(i=>i.id===aId),b=state.inventory.find(i=>i.id===bId);if(!a||!b)return;
    if((a.rarity||"common")!==(b.rarity||"common")){alert("兩件裝備必須是相同品質。");return;}
    const cat=alchemyMajorCategory(a);if(!cat||cat!==alchemyMajorCategory(b)){alert("兩件裝備必須屬於相同大分類：武器、防具或首飾。");return;}
    const next=nextRarityId(a.rarity||"common",false);if(!next){alert("傳說裝備無法在鍊金爐繼續升階。");return;}
    const risky=(a.refine||0)>0||(b.refine||0)>0||a.spirit||b.spirit;
    if(!confirm(`確定消耗「${a.name}」與「${b.name}」，重新鍊成一件${RARITIES.find(r=>r.id===next).name}品質裝備嗎？${risky?"\n其中包含精煉或寄宿精靈效果，鍊成後不會保留。":""}`))return;
    state.inventory=state.inventory.filter(i=>i.id!==a.id&&i.id!==b.id);const result=randomAlchemyGear(cat,next);if(result)addInventory(result);
    log(`鍊金爐重新凝成了${result?.name||"一件新裝備"}。`,"good");autoSave();renderAlchemyModal(document.getElementById("modalContent"));
  }

  function claimCamp(){
    const activity=state.camp?.activity;if(!CAMP_ACTIVITIES[activity])return;
    const elapsed=campElapsedMs(),minutes=elapsed/60000;if(minutes<CAMP_MIN_CLAIM_MINUTES)return;
    const hours=elapsed/3600000,bonus=campBonus(activity),results=[];
    if(activity==="training"){
      const exp=Math.max(1,Math.floor(Math.max(4,xpNeeded(state.player.level)*.12)*hours*bonus));
      gainExp(exp);results.push(`經驗 +${exp}`);
      const w=mainWeapon();
      if(w){
        const gain=Math.max(0,Math.floor(hours*1.5*bonus));
        if(gain>0){
          const before=state.player.mastery[w.weaponType]||0;state.player.mastery[w.weaponType]=Math.min(100,before+gain);
          results.push(`${w.weaponType}熟練度 +${state.player.mastery[w.weaponType]-before}`);
        }
      }
    }else if(activity==="gather"){
      const gold=Math.max(1,Math.floor((12+state.player.level*3)*hours*bonus));state.player.gold+=gold;results.push(`金幣 +${gold}`);
      const qty=Math.max(1,Math.floor(hours/2*bonus));
      const supply=createStack(pick([CONSUMABLES[0],CONSUMABLES[2],CONSUMABLES[3]]),qty);
      if(addInventory(supply))results.push(`${supply.name} ×${qty}`);else if(addWarehouse(supply))results.push(`${supply.name} ×${qty}（已送入倉庫）`);
    }else if(activity==="mining"){
      const raw=hours*.80*bonus,qty=Math.max(hours>=.5?1:0,Math.floor(raw)+(Math.random()<raw%1?1:0));
      if(qty>0){const stones=createStack(REFINEMENT_STONE,qty);if(addInventory(stones))results.push(`精煉石 ×${qty}`);else if(addWarehouse(stones))results.push(`精煉石 ×${qty}（已送入倉庫）`);}
      const gold=Math.max(0,Math.floor(hours*(4+state.player.level)));if(gold>0){state.player.gold+=gold;results.push(`金幣 +${gold}`);}
    }else if(activity==="meditate"){
      const exp=Math.max(1,Math.floor(Math.max(2,xpNeeded(state.player.level)*.05)*hours*bonus));gainExp(exp);results.push(`經驗 +${exp}`);
      const sp=Math.max(1,Math.floor(hours*10*bonus)),before=state.player.spirit;state.player.spirit=clamp(state.player.spirit+sp,0,100);
      if(state.player.spirit>before)results.push(`氣力 +${state.player.spirit-before}`);
      const rareChance=1-Math.pow(1-.003,Math.max(.25,hours));
      if(Math.random()<rareChance){
        const stone=createSpiritAttachStone();if(addInventory(stone))results.push(stone.name);else if(addWarehouse(stone))results.push(`${stone.name}（已送入倉庫）`);
      }
    }
    state.camp={activity:null,startedAt:0};
    log(`龍脊營地結算：${results.length?results.join("、"):"這段時間沒有帶回可用成果"}。`,"gold");
    autoSave();renderCampModal(document.getElementById("modalContent"));render();
  }
